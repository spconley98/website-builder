# Areas + industries to hunt for leads. Re-runnable batch list — `leadpipe run` (no flags)
# walks every entry below. Override any single one with CLI flags for a one-off:
#   leadpipe find --area "Austin, TX" --radius 5km --industry restaurants

targets:
  - area: "Austin, TX"
    radius: 5km
    industries:
      - restaurants
      - landscaping

  - area: "San Antonio, TX"
    radius: 8km
    industries:
      - plumbers
      - roofing
