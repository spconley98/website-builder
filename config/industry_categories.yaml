# Broad-category groupings for the "AI Leads" reports (reports.py renders each
# category as a `###` heading section). Matching is case-insensitive substring
# matching against Lead.industry, first rule wins — add keywords as new
# industries show up from hunts. Anything that matches nothing falls into
# `other_label`.

categories:
  - label: Trades
    match:
      - plumb
      - electric
      - hvac
      - roof
      - handyman
      - landscap
      - contractor
      - concrete
      - curbing

  - label: Nursery & Garden
    match:
      - nursery
      - garden
      - plant nursery   # not bare "plant" — avoids "power plant"/"plant hire" false matches
      - irrigation       # "irrigation supply" lands here; "irrigation contractor" -> Trades (matched first)

  - label: Food & Beverage
    match:
      - coffee
      - cafe
      - restaurant
      - bakery
      - bar
      - brewery

other_label: Other
