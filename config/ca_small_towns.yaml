# Reference menu of smaller CA towns/counties for hunt targeting.
# NOT read by code — pure reference for humans/agents picking targets.
# To use: copy an entry into targets.<profile>.yaml as a new Target, or run a
# one-off hunt: `leadpipe find --area "<town>, CA" --industry "<industry>"`.
#
# Rationale: smaller towns (roughly pop. 5k-60k) tend to have less tech-savvy
# local businesses and less competition for "no website" leads than big cities.

