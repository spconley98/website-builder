# Sean's hunt list. `leadpipe run --profile sean` uses this file.
# One-off CLI flags (`--area`, `--industry`) override this file.
#
# Retargeted 2026-06-11: small-town-first. Bigger cities (Sacramento, San Jose,
# Oakland, Fresno, Santa Rosa) are saturated/competitive; smaller CA towns have
# more no-website opportunity. See config/ca_small_towns.yaml for more options.

