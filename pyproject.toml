[project]
name = "leadpipe"
version = "0.1.0"
description = "Local-AI lead pipeline — finds local businesses without websites, prioritizes by available photos"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "filelock>=3.14",
]

[project.scripts]
leadpipe = "leadpipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadpipe"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
